name: Delete merged pull-request branches

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-merged-head:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged same-repo branch (if it still exists)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if gh api -X DELETE "repos/${REPO}/git/refs/heads/${BRANCH}"; then
            echo "Deleted merged PR branch: ${BRANCH}"
          else
            echo "Branch may already be deleted or token permissions may be restricted"
            exit 1
          fi
