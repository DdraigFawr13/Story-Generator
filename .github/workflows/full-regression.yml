name: Full regression

# Tier 3 on demand: all 100 seeds in both batteries plus the coverage verifier, and every
# browser engine. Pick the branch in "Use workflow from"; optionally pin a commit SHA.
# On a PR, adding the `full-regression` label runs the same suite as part of normal CI.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or tag to verify (leave empty for the selected branch head).
        type: string
        default: ''

permissions:
  contents: read

jobs:
  full:
    uses: ./.github/workflows/ci.yml
    with:
      full: true
      ref: ${{ inputs.ref }}
