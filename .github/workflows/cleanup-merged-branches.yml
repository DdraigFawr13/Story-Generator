name: Delete merged pull-request branches

# Fallback until Settings > General > "Automatically delete head branches" is enabled.
# Once it is, the job skips itself (no runner minutes) and this file can be deleted.

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-merged-head:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.repository.delete_branch_on_merge != true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Delete merged same-repo branch (if it still exists)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if ! gh api "repos/${REPO}/git/ref/heads/${BRANCH}" --silent 2>/dev/null; then
            echo "Branch ${BRANCH} is already gone."
            exit 0
          fi
          gh api -X DELETE "repos/${REPO}/git/refs/heads/${BRANCH}"
          echo "Deleted merged PR branch: ${BRANCH}"
