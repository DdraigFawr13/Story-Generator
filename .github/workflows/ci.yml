name: Core and browser verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run boundaries
      - run: npm test -- --exclude tests/unit/settlement-seed-battery.test.ts --exclude tests/unit/living-seed-battery.test.ts
      - run: npm run build
      - run: python3 docs/probes/terrain_probe.py
      - run: python3 docs/probes/resident_probe.py --check tests/fixtures/residents.json
  seed-battery:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        suite: [settlement, living]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - run: mkdir -p test-results
      - run: npm test -- tests/unit/${{ matrix.suite }}-seed-battery.test.ts
        env:
          STORY_GENERATOR_BATTERY_SHARD: ${{ matrix.shard }}/4
          STORY_GENERATOR_REPORT: test-results/seed-battery-settlement-${{ matrix.shard }}.json
          STORY_GENERATOR_LIVING_REPORT: test-results/seed-battery-living-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: seed-battery-${{ matrix.suite }}-${{ matrix.shard }}
          path: test-results/seed-battery-${{ matrix.suite }}-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 7
  core:
    needs: [unit, seed-battery]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every core partition
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          BATTERY_RESULT: ${{ needs.seed-battery.result }}
        run: test "$UNIT_RESULT" = success && test "$BATTERY_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: seed-battery-*
          merge-multiple: true
          path: test-results/seed-battery
      - run: node scripts/verify-seed-battery.mjs test-results/seed-battery --living
  browser-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.project }}
      - run: npm run test:browser -- --project=${{ matrix.project }} --workers=2 --shard=${{ matrix.shard }}/2 --fully-parallel --forbid-only --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/browser-report-${{ matrix.project }}-${{ matrix.shard }}-of-2.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-report-${{ matrix.project }}-${{ matrix.shard }}-of-2
          path: test-results/browser-report-${{ matrix.project }}-${{ matrix.shard }}-of-2.json
          if-no-files-found: error
          retention-days: 7
  browser:
    needs: browser-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every browser partition
        env:
          BROWSER_RESULT: ${{ needs.browser-tests.result }}
        run: test "$BROWSER_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: browser-report-*
          merge-multiple: true
          path: test-results/browser-reports
      - run: npx playwright test --list --fully-parallel --forbid-only --reporter=json > test-results/browser-expected.json
      - run: node scripts/verify-browser-reports.mjs test-results/browser-expected.json test-results/browser-reports
